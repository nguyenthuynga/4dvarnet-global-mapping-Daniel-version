domain: ???
ckpt: null
xpname: Only2nadirs_s3aNs6a2024




datamodule: #Nga code for 2024
  _target_: contrib.glorys12.DistinctNormDataModule
  input_da:
    _target_: contrib.glorys12.load_glorys12_data_on_fly_inp
    tgt_path: /SCRATCH/n23nguye/glorys12_2010_2019_daily_sla_4th_target_gridded_alongtrack.nc
    tgt_var: sla
    # inp_path: /SCRATCH/n23nguye/glorys12_2010_2019_daily_sla_4th_input_gridded_alongtrack.nc
    # inp_var: sla
    # inp_path: /SCRATCH/n23nguye/mapping_2024/mask_onlynadirs_2024_365d.nc # ONLY 6nadirs mask_onlynadirs_2024_365d.nc
    # inp_path: /SCRATCH/n23nguye/mapping_2024/mask_nadirsNswot_2024_365d.nc # SWOT+6nadirs
    inp_path: /SCRATCH/n23nguye/mapping_2023_2025/mask_only2nadirss3aNs6a_2024_365d.nc # SWOT+6nadirs
    inp_var: mask          # <-- Nga mask's variable name (Daniel's is 'inp')
  xrds_kw:
    train:
      patch_dims: {time: 15, lat: 256, lon: 256}
      strides: {time: 1, lat: 16, lon: 16}
      domain_limits: ${domain.train}
      noise: 0.03  # null
      noise_type: gaussian+uniform
      periodic_dim: lon
      padded_dim: lat
    val:
      patch_dims: {time: 15, lat: 512, lon: 512}
      strides: {time: 1, lat: 136, lon: 488}
      domain_limits: ${domain.train}
      noise: 0.03  # null
      noise_type: uniform-constant

defaults:
  - unet
  - _self_


