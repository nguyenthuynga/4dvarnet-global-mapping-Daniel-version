# @package _global_
domain: ???
ckpt: null
xpname: osse_random_pretrain_FDVarNet3D18M_GAPFREEtarget_bs2

datamodule:
  _target_: contrib.glorys12.real_random_osse.RealRandomOSSEDataModule
  mode_target: gapfree
  k_min: 2
  k_max: 7  #null                 # null -> all masks in the pool
  input_da:
    _target_: contrib.glorys12.real_random_osse.load_glorys12_osse_masks
    tgt_path: /SCRATCH/n23nguye/glorys12_2010_2019_daily_sla_4th_target_gridded_alongtrack.nc
    tgt_var: sla
    mask_var: mask
    target_mask_idx: [0,1,2,3,4,5,6,7,8]     # ALL of these form the target union (8 nadirs + SWOT)
    mask_paths:
      - /SCRATCH/n23nguye/mapping_2023_2025/mask_alg_2024_365d.nc   #alg is also here
      - /SCRATCH/n23nguye/mapping_2023_2025/mask_c2n_2024_365d.nc
      - /SCRATCH/n23nguye/mapping_2023_2025/mask_h2b_2024_365d.nc
      - /SCRATCH/n23nguye/mapping_2023_2025/mask_j3n_2024_365d.nc
      - /SCRATCH/n23nguye/mapping_2023_2025/mask_s3a_2024_365d.nc
      - /SCRATCH/n23nguye/mapping_2023_2025/mask_s3b_2024_365d.nc
      - /SCRATCH/n23nguye/mapping_2023_2025/mask_s6alr_2024_365d.nc
      - /SCRATCH/n23nguye/mapping_2023_2025/mask_swon_2024_365d.nc
      - /SCRATCH/n23nguye/mapping_2023_2025/mask_SWOT_2024_365d.nc    # KaRIn swath, LWE-removed
  domains:
    train:
      time: {_target_: builtins.slice, _args_: ['2010-01-01', '2017-12-31']}
    val:
      time: {_target_: builtins.slice, _args_: ['2018-01-01', '2018-12-31']}
    test: null
  xrds_kw:
    train:
      patch_dims: {time: 15, lat: 256, lon: 256}
      strides: {time: 1, lat: 16, lon: 16}
      domain_limits: ${domain.train}
      noise: 0.03
      noise_type: gaussian+uniform
      periodic_dim: lon
      padded_dim: lat
    val:
      patch_dims: {time: 15, lat: 512, lon: 512}
      strides: {time: 1, lat: 136, lon: 488}
      domain_limits: ${domain.train}
      noise: 0.03
      noise_type: uniform-constant
  dl_kw: {batch_size: 2, num_workers: 8}

model:
  _target_: contrib.4dvarnet_3d.models_UNet_unrolling.Lit4dVarNetIgnoreNaN
  w_mse: 50.
  w_grad_mse: 1000.
  w_prior: 1.
  w_mse_lr: 0.
  w_grad_mse_lr: 0
  osse_with_interp_error: false
  opt_fn:
    _target_: contrib.glorys12.unet.cosanneal_lr_adam_base   # or copy src.utils.cosanneal_lr_adam
    _partial_: true
    lr: 1e-4
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: ocean4dvarnet.utils.get_triang_time_wei
    patch_dims: ${datamodule.xrds_kw.train.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  val_rec_weight:
    _target_: ocean4dvarnet.utils.get_triang_time_wei
    patch_dims: ${datamodule.xrds_kw.val.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  solver:
    _target_: contrib.4dvarnet_3d.models_UNet_unrolling.GradSolver_withStep
    n_step: 3
    lr_grad: 0
    std_init: 0.1
    input_grad_update: 'subgrad+state'
    prior_cost:
      _target_: contrib.4dvarnet_3d.models_UNet_unrolling.GenericAEPriorCost
      model_ae:
        _target_: contrib.4dvarnet_3d.unet_UNetUnroliing_3d_film.UNet3D_Transformer_priorcost
        in_channels: 1
        channels: [24, 48, 96, 192]
    obs_cost:
      _target_: ocean4dvarnet.models.BaseObsCost
    grad_mod:
      _target_: contrib.4dvarnet_3d.models_UNet_unrolling.GradModelWithCondition
      grad_model:
        _target_: contrib.4dvarnet_3d.unet_UNetUnroliing_3d_film.UNet3D_Transformer_gradmod
        in_channels: 3
        channels: [24, 48, 96, 192]



