model: #56M parameters
  _target_: contrib.4dvarnet_latent.models.Lit4dVarNetIgnoreNaN
  w_mse: 50.0
  w_grad_mse: 1000.0
  w_prior: 1.0
  persist_rw: false
  opt_fn:
    _target_: contrib.4dvarnet_latent.models.cosanneal_lr_adam_base
    _partial_: true
    lr: 0.0001
    T_max: ${trainer.max_epochs}
  rec_weight:
    _target_: ocean4dvarnet.utils.get_triang_time_wei
    patch_dims: ${datamodule.xrds_kw.train.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  val_rec_weight:
    _target_: ocean4dvarnet.utils.get_triang_time_wei
    patch_dims: ${datamodule.xrds_kw.val.patch_dims}
    crop: {time: 0, lat: 4, lon: 4}
  norm_stats: ${datamodule.norm_stats}
  w_mse_lr: 0.0
  w_grad_mse_lr: 0
  osse_with_interp_error: false
  solver:
    _target_: contrib.4dvarnet_latent.models.GradSolver_withStep
    dim_in: 15
    dropout: 0.1
    channel_dims:
    - 256
    - 256
    - 256
    - 256
    - 256
    - 256
    - 256
    - 256
    - 256
    - 512
    bias: false
    interp_mode: bilinear
    activation_layer:
      _target_: torch.nn.ReLU
    n_step: 5
    lr_grad: 0.0
    std_init: 0.1
    input_grad_update: grad
    prior_cost:
      _target_: contrib.4dvarnet_latent.models.GenericAEPriorCost
      model_ae:
        _target_: contrib.4dvarnet_latent.unet_unrolling.UNetModel
        dims: 2
        in_channels: 15
        out_channels: 15
        model_channels: 64
        num_res_blocks: 2
        channel_mult:
        - 1
        - 2
        - 4
        attention_resolutions: []
        use_checkpoint: true
        dropout: 0.1
        bias: false
    obs_cost:
      _target_: ocean4dvarnet.models.BaseObsCost
    grad_mod:
      _target_: contrib.4dvarnet_latent.models.GradModelWithCondition
      grad_model:
        _target_: contrib.4dvarnet_latent.unet_unrolling.UNetModel2
        dims: 2
        in_channels: 15
        out_channels: 15
        model_channels: 96
        num_res_blocks: 3
        channel_mult:
        - 1
        - 2
        - 4
        attention_resolutions: []
        use_checkpoint: true
        dropout: 0.1
        bias: false
        interp_mode: bilinear

defaults:
  - unet
  - _self_

