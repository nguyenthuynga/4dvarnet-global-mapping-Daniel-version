domain:
  train:
    lat:
      _target_: builtins.slice
      _args_:
      - -80
      - 90
    lon:
      _target_: builtins.slice
      _args_:
      - -180
      - 180
  test:
    lat:
      _target_: builtins.slice
      _args_:
      - -79
      - 89
    lon:
      _target_: builtins.slice
      _args_:
      - -179
      - 179
ckpt: /Odyssey/private/p25denai/4dvarnet-ronan_dev/outputs/2026-01-21/glo12-sla-4th-unet15M-unrolling-aeunet_64_2_96_3-randinit-5iter-grad-ossev2-noiseg+u03-14-15-27/unet_unrolling_5iter_grad/checkpoints/last.ckpt
xpname: glo12-sla-4th-unet15M-unrolling-aeunet_64_2_96_3-randinit-5iter-grad-ossev2-noiseg+u03
trainer:
  _target_: pytorch_lightning.Trainer
  inference_mode: false
  deterministic: true
  gradient_clip_val: 0.5
  accelerator: gpu
  devices: 1
  logger:
    _target_: pytorch_lightning.loggers.tensorboard.TensorBoardLogger
    save_dir: ${hydra:runtime.output_dir}
    name: ${hydra:runtime.choices.xp}
    version: ''
  max_epochs: 2000
  limit_train_batches: 100
  callbacks:
  - _target_: pytorch_lightning.callbacks.LearningRateMonitor
  - _target_: pytorch_lightning.callbacks.ModelCheckpoint
    monitor: val_loss
    save_last: true
    save_top_k: 3
    filename: '{val_loss:.5f}-{epoch:03d}'
  check_val_every_n_epoch: 3
  accumulate_grad_batches: 1
datamodule:
  _target_: contrib.glorys12.DistinctNormDataModulewInputTracks
  input_da:
    _target_: contrib.glorys12.load_glorys12_data_on_fly_inp
    tgt_path: /Odyssey/public/glorys/reanalysis/glorys12_2010_2019_daily_sla_4th_gridded_from_alongtrack.nc
    tgt_var: tgt
    inp_path: /Odyssey/public/glorys/reanalysis/glorys12_2010_2019_daily_sla_4th_gridded_from_alongtrack.nc
    inp_var: obs
  domains:
    train:
      time:
        _target_: builtins.slice
        _args_:
        - '2010-01-01'
        - '2017-12-31'
    val:
      time:
        _target_: builtins.slice
        _args_:
        - '2018-01-01'
        - '2018-12-31'
    test: null
  xrds_kw:
    train:
      patch_dims:
        time: 15
        lat: 256
        lon: 256
      strides:
        time: 1
        lat: 196
        lon: 154
      domain_limits: ${domain.train}
      noise: 0.03
      noise_type: gaussian+uniform
    val:
      patch_dims:
        time: 15
        lat: 512
        lon: 512
      strides:
        time: 1
        lat: 136
        lon: 488
      domain_limits: ${domain.train}
      noise: 0.03
      noise_type: gaussian+uniform
  dl_kw:
    batch_size: 4
    num_workers: 4
  norm_stats:
    train:
    - -0.001930378327255099
    - 0.08604745118775728
    val:
    - 0.01560162689028551
    - 0.08583080433051968

